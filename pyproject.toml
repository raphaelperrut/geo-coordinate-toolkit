[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-coordinate-toolkit"
version = "0.1.0"
description = "A lightweight Python toolkit for coordinate transformation, CRS inspection and geospatial geometry utilities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Raphael Perrut" }
]

dependencies = [
    "pyproj>=3.7,<4",
    "typer>=0.15,<1",
    "rich>=13,<15"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9"
]

[project.scripts]
geo-coord = "geo_coordinate_toolkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]